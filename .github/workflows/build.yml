name: Build PromptPeek

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o PromptPeek-Cloud-Build.zip

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("PromptPeek/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              "android {\n",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          """,
              1
          )

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: PromptPeek
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PromptPeek-APK
          path: PromptPeek/app/build/outputs/apk/debug/app-debug.apk
